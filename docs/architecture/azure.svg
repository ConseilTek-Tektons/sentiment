<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sentiment Azure managed architecture</title><desc id="desc">Sentiment runs on Azure App Service Web App for Containers and connects through VNet integration to PostgreSQL Flexible Server and Azure Managed Redis.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09090c"/><stop offset="1" stop-color="#151833"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#a3ff12"/><stop offset="1" stop-color="#9b5cff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#a3ff12"/></marker><style>.title{font:700 42px Inter,Arial;fill:#fff}.sub{font:500 17px Inter,Arial;fill:#aaa9b6}.h{font:700 19px Inter,Arial;fill:#fff}.t{font:500 14px Inter,Arial;fill:#c5c4cf}.tiny{font:700 13px Inter,Arial;fill:#a3ff12;letter-spacing:1px}.b{fill:#15151d;stroke:#464451;stroke-width:2}.p{fill:#15151d;stroke:url(#g);stroke-width:3}.d{fill:#101b15;stroke:#6fb22a;stroke-width:2}.line{fill:none;stroke:#a3ff12;stroke-width:3;marker-end:url(#a)}.dash{fill:none;stroke:#7c788b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/><text x="70" y="78" class="tiny">CONSEILTEK • AZURE DEPLOYMENT</text><text x="70" y="132" class="title">Sentiment on Azure managed services</text><text x="70" y="168" class="sub">App Service Web App for Containers is the compute layer. Blob Storage remains private and never hosts the application.</text>
  <rect x="60" y="250" width="220" height="118" rx="20" class="b"/><text x="92" y="294" class="tiny">PUBLIC ENTRY</text><text x="92" y="334" class="h">Users + custom DNS</text>
  <rect x="60" y="465" width="220" height="135" rx="20" class="b"/><text x="92" y="507" class="tiny">IDENTITY</text><text x="92" y="547" class="h">Entra / Okta / Duo</text><text x="92" y="575" class="t">OIDC or SAML broker</text>
  <rect x="365" y="220" width="410" height="190" rx="25" class="p"/><text x="400" y="265" class="tiny">MANAGED WEB COMPUTE</text><text x="400" y="310" class="h">Azure App Service</text><text x="400" y="340" class="t">Web App for Containers • managed TLS</text><text x="400" y="368" class="t">health check • autoscale • deployment slots</text>
  <rect x="365" y="475" width="410" height="125" rx="22" class="b"/><text x="400" y="520" class="tiny">RUNTIME IDENTITY</text><text x="400" y="560" class="h">Managed identity + Key Vault</text>
  <rect x="870" y="210" width="660" height="475" rx="28" fill="#101016" stroke="#504d5c" stroke-width="2"/><text x="910" y="252" class="tiny">VIRTUAL NETWORK • DELEGATED SUBNETS + PRIVATE ENDPOINTS</text>
  <rect x="920" y="295" width="265" height="135" rx="20" class="d"/><text x="950" y="337" class="tiny">POSTGRESQL 16</text><text x="950" y="377" class="h">Flexible Server</text><text x="950" y="405" class="t">private DNS • backup • HA</text>
  <rect x="1220" y="295" width="265" height="135" rx="20" class="d"/><text x="1250" y="337" class="tiny">CACHE / RATE LIMIT</text><text x="1250" y="377" class="h">Azure Managed Redis</text><text x="1250" y="405" class="t">TLS • private endpoint</text>
  <rect x="920" y="480" width="265" height="130" rx="20" class="b"/><text x="950" y="522" class="tiny">ASYNC WORK</text><text x="950" y="562" class="h">Storage Queue</text><text x="950" y="590" class="t">managed identity access</text>
  <rect x="1220" y="480" width="265" height="130" rx="20" class="b"/><text x="1250" y="522" class="tiny">PRIVATE ARTIFACTS</text><text x="1250" y="562" class="h">Blob container</text><text x="1250" y="590" class="t">public access disabled</text>
  <rect x="365" y="695" width="410" height="115" rx="20" class="b"/><text x="400" y="737" class="tiny">OBSERVABILITY</text><text x="400" y="777" class="h">App Service logs + Azure Monitor</text>
  <rect x="920" y="735" width="265" height="85" rx="18" class="b"/><text x="950" y="785" class="h">VNet outbound</text><rect x="1220" y="735" width="265" height="85" rx="18" class="b"/><text x="1250" y="785" class="h">OpenAI API (optional)</text>
  <path d="M280 309H363" class="line"/><path d="M280 532H363" class="dash"/><path d="M775 315H845V363H918" class="line"/><path d="M845 363V545H918" class="line"/><path d="M845 363H1218" class="line"/><path d="M775 537H868" class="dash"/><path d="M775 750H918" class="dash"/><path d="M1185 777H1218" class="dash"/>
  <text x="870" y="713" class="t">VNet integration keeps PostgreSQL and Redis off public networks.</text>
</svg>
