<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sentiment application architecture</title>
  <desc id="desc">Enterprise users authenticate through OIDC or a SAML broker, enter the Next.js application, are authorized by RBAC, use scheduling workflows and an AI copilot, and persist data in PostgreSQL and Redis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090c"/><stop offset="1" stop-color="#181027"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a3ff12"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#a3ff12"/></marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#fff}.sub{font:500 17px Inter,Arial,sans-serif;fill:#a9a9b7}.h{font:700 20px Inter,Arial,sans-serif;fill:#fff}.t{font:500 15px Inter,Arial,sans-serif;fill:#cac9d4}.tiny{font:600 13px Inter,Arial,sans-serif;fill:#a3ff12;letter-spacing:1px}.box{fill:#15151d;stroke:#383744;stroke-width:2}.core{fill:#17141e;stroke:url(#accent);stroke-width:3}.data{fill:#101b15;stroke:#68a927;stroke-width:2}.ai{fill:#1a1326;stroke:#9b5cff;stroke-width:2}.line{fill:none;stroke:#a3ff12;stroke-width:3;marker-end:url(#arrow)}.muted{fill:none;stroke:#646276;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <circle cx="1450" cy="80" r="170" fill="#7b2cff" opacity=".12"/><circle cx="70" cy="780" r="220" fill="#a3ff12" opacity=".06"/>
  <text x="70" y="78" class="tiny">CONSEILTEK • REFERENCE ARCHITECTURE</text>
  <text x="70" y="132" class="title">Sentiment application flow</text>
  <text x="70" y="168" class="sub">Engagement and performance workflows with enterprise identity, enforced anonymity, grounded AI, and auditable PostgreSQL state.</text>

  <rect x="70" y="260" width="210" height="170" rx="22" class="box"/>
  <text x="100" y="302" class="tiny">PEOPLE</text><text x="100" y="342" class="h">Enterprise users</text>
  <text x="100" y="375" class="t">Owner • manager</text><text x="100" y="402" class="t">Host • analyst • viewer</text>

  <rect x="70" y="505" width="210" height="155" rx="22" class="box"/>
  <text x="100" y="547" class="tiny">IDENTITY</text><text x="100" y="587" class="h">OIDC / SAML</text>
  <text x="100" y="620" class="t">Okta • Entra ID • Duo</text>

  <rect x="380" y="230" width="690" height="480" rx="30" class="core"/>
  <text x="420" y="276" class="tiny">MANAGED WEB APPLICATION • NEXT.JS / NODE.JS</text>
  <rect x="420" y="310" width="185" height="115" rx="18" class="box"/><text x="445" y="348" class="h">Experience</text><text x="445" y="379" class="t">Dashboard + admin</text><text x="445" y="405" class="t">Responsive UI</text>
  <rect x="635" y="310" width="185" height="115" rx="18" class="box"/><text x="660" y="348" class="h">Authentication</text><text x="660" y="379" class="t">Signed JWT session</text><text x="660" y="405" class="t">Group claims</text>
  <rect x="850" y="310" width="180" height="115" rx="18" class="box"/><text x="875" y="348" class="h">Authorization</text><text x="875" y="379" class="t">Feature RBAC</text><text x="875" y="405" class="t">Server-side checks</text>
  <rect x="420" y="465" width="285" height="190" rx="20" class="box"/><text x="450" y="505" class="tiny">DOMAIN WORKFLOWS</text><text x="450" y="545" class="h">Surveys &amp; reviews</text><text x="450" y="578" class="t">Survey cycles • reviews</text><text x="450" y="607" class="t">Query-time anonymity • audit</text><text x="450" y="636" class="t">Goals • actions • 1:1s</text>
  <rect x="745" y="465" width="285" height="190" rx="20" class="ai"/><text x="775" y="505" class="tiny">AI COPILOT</text><text x="775" y="545" class="h">Grounded operations Q&amp;A</text><text x="775" y="578" class="t">Local knowledge retrieval</text><text x="775" y="607" class="t">Optional OpenAI file_search</text><text x="775" y="636" class="t">Rate limit • permission gate</text>

  <rect x="1180" y="230" width="350" height="155" rx="22" class="data"/>
  <text x="1215" y="272" class="tiny">SYSTEM OF RECORD</text><text x="1215" y="314" class="h">PostgreSQL 16</text><text x="1215" y="347" class="t">Separated response data • audit</text>
  <rect x="1180" y="420" width="350" height="120" rx="22" class="data"/>
  <text x="1215" y="462" class="tiny">FAST STATE</text><text x="1215" y="504" class="h">Managed Redis</text>
  <rect x="1180" y="575" width="350" height="135" rx="22" class="ai"/>
  <text x="1215" y="617" class="tiny">OPTIONAL AI PROVIDER</text><text x="1215" y="659" class="h">OpenAI Responses + vector store</text><text x="1215" y="687" class="t">No training on tenant records by this app</text>

  <path d="M280 345H378" class="line"/><path d="M280 580H635V427" class="line"/>
  <path d="M1070 310H1178" class="line"/><path d="M1070 480H1178" class="line"/><path d="M1030 570H1178V643" class="muted"/>
  <path d="M605 367H633" class="line"/><path d="M820 367H848" class="line"/><path d="M940 425V463" class="line"/><path d="M705 560H743" class="muted"/>

  <rect x="380" y="760" width="1150" height="78" rx="18" fill="#101015" stroke="#34333e"/>
  <text x="420" y="793" class="tiny">CROSS-CUTTING CONTROLS</text><text x="420" y="821" class="t">TLS • least privilege • tenant scope • Zod validation • audit events • health checks • encrypted secrets • backups • structured logs</text>
</svg>
