name: sentiment
services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      APP_NAME: Sentiment
      WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-only-change-before-deploying-32-chars
      AUTH_DEMO_MODE: "true"
      DATABASE_URL: postgres://sentiment:sentiment@postgres:5432/sentiment
      REDIS_URL: redis://redis:6379
      OIDC_PROVIDER_NAME: ConseilTek Local SSO
      OIDC_ISSUER: http://idp.localtest.me:8080/realms/sentiment
      OIDC_CLIENT_ID: sentiment-web
      OIDC_CLIENT_SECRET: local-dev-secret
    extra_hosts:
      - "idp.localtest.me:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentiment
      POSTGRES_USER: sentiment
      POSTGRES_PASSWORD: sentiment
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentiment -d sentiment"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      KC_HOSTNAME: http://idp.localtest.me:8080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
